["By June she will have been working here for ten years.","fut-pc",["fut-pc","fut-p","fut-c","pres-pc"]]];

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function answer(id){

var q=Q[qi],ok=id===q[1];if(ok)right++;
document.querySelectorAll(".opt").forEach(function(b){var i=b.getAttribute("data-id");if(i===q[1])b.classList.add("ok");else if(i===id)b.classList.add("bad")});
$("fb").textContent=(ok?"Верно! ":"Не совсем. ")+"Это "+byId[q[1]].n+": "+byId[q[1]].note;
$("show").hidden=false;$("next").hidden=false;
$("score").textContent="Верно: "+right+" из "+done}
$("next").onclick=function(){qi=(qi+1)%Q.length;ask()};
$("show").onclick=function(){view(1);pick(Q[qi][1]);$("one").scrollIntoView({behavior:"smooth",block:"start"})};

buildGrid();pick(sel);ask();
</script>

<script>
var POOL=Q.concat([["She is cooking dinner right now.","pres-c",["pres-c","pres-s","pres-pc","fut-c"]],["The train leaves at 9 a.m. every day.","pres-s",["pres-s","pres-c","fut-s","pres-p"]],["I will call you tomorrow.","fut-s",["fut-s","fut-c","pres-c","fut-p"]],["They were playing football when it started to rain.","past-c",["past-c","past-s","past-pc","past-p"]]]);
var BK="tensesBest",N=8,order=[],qi=0,right=0,done=0,answered=false,fin=false,acc=0,last=0,tmr=null;
var be=document.createElement("div");be.className="sub";be.id="best";be.style.marginTop="10px";$("quiz").appendChild(be);
function best(){try{var v=localStorage.getItem(BK);return v?JSON.parse(v):null}catch(e){return null}}
function saveBest(b){try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function better(a,b){return !b||a.c>b.c||(a.c===b.c&&a.t<b.t)}
function showBest(){var b=best();be.textContent=b?"Лучший результат: "+b.c+" из "+b.n+" за "+fmt(b.t):"Лучшего результата пока нет"}
function elapsed(){return acc+(last?Date.now()-last:0)}
function sync(){var inQ=!$("quiz").hidden;if(inQ&&!last&&!fin)last=Date.now();if(!inQ&&last){acc+=Date.now()-last;last=0}}
var _view=view;view=function(v){_view(v);sync()};
function tick(){if(fin||$("quiz").hidden)return;$("score").textContent="Верно: "+right+" из "+done+" · ⏱ "+fmt(elapsed())}
function startRound(){
order=shuffle(POOL).slice(0,N);qi=0;right=0;done=0;fin=false;acc=0;last=0;sync();
clearInterval(tmr);tmr=setInterval(tick,500);
showBest();ask()}
function ask(){
var q=order[qi];answered=false;
$("qt").textContent=(qi+1)+"/"+N+". "+q[0];$("fb").textContent="";$("show").hidden=true;$("next").hidden=true;
$("opts").innerHTML="";
shuffle(q[2]).forEach(function(id){var b=document.createElement("button");b.className="opt";b.textContent=byId[id].n;b.setAttribute("data-id",id);b.onclick=function(){answer(id)};$("opts").appendChild(b)});
tick();if(!$("quiz").hidden||done===0)$("score").textContent="Верно: "+right+" из "+done+" · ⏱ "+fmt(elapsed())}
function answer(id){
if(answered||fin)return;answered=true;done++;
var q=order[qi],ok=id===q[1];if(ok)right++;
document.querySelectorAll(".opt").forEach(function(b){var i=b.getAttribute("data-id");if(i===q[1])b.classList.add("ok");else if(i===id)b.classList.add("bad")});
$("fb").textContent=(ok?"Верно! ":"Не совсем. ")+"Это "+byId[q[1]].n+": "+byId[q[1]].note;
$("show").hidden=false;$("next").hidden=false;$("next").textContent=qi>=N-1?"Результат":"Дальше";
tick()}
function finish(){
var t=elapsed();fin=true;acc=t;last=0;
var res={c:right,n:N,t:t},b=best(),nb=better(res,b);
if(nb)saveBest(res);
$("qt").textContent="Готово! "+right+" из "+N+" за "+fmt(t);
$("opts").innerHTML="";
$("fb").textContent=nb?"Новый лучший результат!":"Прошлый рекорд пока не побит. Чем больше правильных ответов и чем быстрее, тем лучше.";
$("show").hidden=true;$("next").hidden=false;$("next").textContent="Ещё раз";
$("score").textContent="";showBest()}
$("next").onclick=function(){if(fin){startRound();return}if(qi>=N-1)finish();else{qi++;ask()}};
$("show").onclick=function(){view(1);pick(order[qi][1]);$("one").scrollIntoView({behavior:"smooth",block:"start"})};
var tb=document.createElement("button");tb.className="totop";tb.textContent="↑";tb.setAttribute("aria-label","Наверх");document.body.appendChild(tb);
window.addEventListener("scroll",function(){tb.classList.toggle("show",window.scrollY>240)},{passive:true});
tb.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
try{history.scrollRestoration="manual"}catch(e){}
window.scrollTo(0,0);
window.addEventListener("load",function(){window.scrollTo(0,0);setTimeout(function(){window.scrollTo(0,0)},60)});
startRound();
</script>

intro.innerHTML='<p style="margin:6px 0 10px">Проверьте, как вы понимаете времена. Предложения в тесте только на английском: нужно выбрать, в каком времени оно написано.</p><ul style="margin:0 0 12px;padding-left:20px"><li><b>8 вопросов</b>: случайные из 11, порядок каждый раз разный.</li><li>У каждого вопроса <b>4 варианта</b> ответа. После ответа сразу видно, правильно ли это и почему.</li><li><b>Идёт секундомер</b>, пока вы на вкладке «Тест». Если перейдёте на «Времена», он встанет на паузу.</li><li>В конце увидите результат: число верных ответов и время. Лучший результат сохраняется в этом браузере: сначала побеждает больше верных, при равенстве быстрее.</li></ul><button class="act" id="start" style="background:var(--fg);color:var(--bg)">Начать тест</button>';

setIntro(true);
</script>
